name: cashpilot
description: "CashPilot - Smart Finance Manager"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.4.2
  path: ^1.9.1
  shared_preferences: ^2.3.4
  fl_chart: ^0.70.2
  intl: ^0.20.2
  google_fonts: ^6.2.1
  go_router: ^14.8.1
  image_picker: ^1.1.2
  uuid: ^4.5.1
  flutter_slidable: ^3.1.1
  animate_do: ^3.3.4
  shimmer: ^3.0.0
  path_provider: ^2.1.5
  share_plus: ^10.1.0
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#E3F6EA"
  remove_alpha_ios: true
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
